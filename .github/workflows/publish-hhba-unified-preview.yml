name: Publish HHBA Unified React Static Preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hhba-unified-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hhba-unified-react-static-commit
  cancel-in-progress: false
jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out static Pages source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check out isolated HHBA frontend branch
        uses: actions/checkout@v4
        with:
          repository: yanm-jun/hhba-talent
          ref: feat/domestic-weekly-cache-pages-20261022
          path: _hhba_source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _hhba_source/apps/web/package-lock.json
      - name: Validate source-linked archived Xiaomi summaries and frontend
        run: |
          cd _hhba_source
          node --test apps/web/scripts/domestic-preview.test.mjs
          node --test apps/web/scripts/featured-fastload.contract.test.mjs
      - name: Build same unified HHBA UI under independent Pages URL
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/yanmingjun.github.io/hhba-unified-preview/'
          VITE_HHBA_DOMESTIC_STATIC_ONLY: '1'
        run: |
          npm ci --prefix _hhba_source/apps/web
          npm run build --prefix _hhba_source/apps/web
      - name: Verify static output and stage separately
        run: |
          set -euo pipefail
          mkdir -p hhba-unified-preview
          cp -a _hhba_source/apps/web/dist/. hhba-unified-preview/
          cp hhba-unified-preview/index.html hhba-unified-preview/404.html
          node - <<'NODE'
          const fs=require('node:fs');
          const root='hhba-unified-preview';
          const data=JSON.parse(fs.readFileSync(root+'/data/domestic-jobs.json','utf8'));
          const jd=JSON.parse(fs.readFileSync(root+'/data/domestic-jd-summaries.json','utf8'));
          if(data.total!==301 || jd.total!==301 || data.jobs.length!==301 || jd.jobs.length!==301)throw Error('missing real domestic data');
          const logistics=jd.jobs.find(x=>x.id==='domestic-xiaomi-7536168291875094637');
          if(!logistics?.responsibilities.includes('整车物流')||!logistics?.requirements.includes('物流'))throw Error('Logistics detail duties/requirements missing');
          if(!fs.readFileSync('hhba-unified-preview/index.html','utf8').includes('/hhba-unified-preview/'))throw Error('Invalid static preview base');
          const html=fs.readFileSync(root+'/index.html','utf8');
          if(!html.includes('/yanmingjun.github.io/hhba-unified-preview/assets/'))throw Error('incorrect Vite asset base');
          if(!fs.existsSync('hhba-domestic-preview/index.html'))throw Error('old static preview missing');
          console.log('HHBA_UNIFIED_PREVIEW_ACCEPTED',data.total,jd.total);
          NODE
          rm -rf _hhba_source
      - name: Persist versioned build in dedicated static directory
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f hhba-unified-preview
          if git diff --cached --quiet; then
            echo 'Current unified static preview is already up to date'
          else
            git commit -m "build: publish verified 301 Xiaomi historical jobs with JD summaries [skip ci]"
            git push origin HEAD:main
          fi
