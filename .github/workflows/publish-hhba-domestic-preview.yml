name: Publish HHBA Domestic Static Preview
on:
  push:
    branches: [main]
    paths:
      - 'hhba-domestic-preview/**'
      - '.github/workflows/publish-hhba-domestic-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-static
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify snapshot and public-only content
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync('hhba-domestic-preview/data/jobs.json','utf8'));
          if(data.kind!=='HHBA_DOMESTIC_SNAPSHOT_V1'||data.jobs.length!==301||data.total!==301)process.exit(1);
          if(data.jobs.some(j=>!j.domestic||j.currentApplicationVerified!==false||!/^https:\/\/xiaomi\.jobs\.f\.mioffice\.cn\//.test(j.url)))process.exit(2);
          if(!fs.existsSync('hhba-domestic-preview/index.html'))process.exit(3);
          console.log('Validated',data.total,'source-linked archival postings');
          NODE
      - name: Check out HHBA unified React source (read-only)
        uses: actions/checkout@v4
        with:
          repository: yanm-jun/hhba-talent
          ref: feat/domestic-weekly-cache-pages-20261022
          path: hhba-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hhba-source/apps/web/package-lock.json
      - name: Validate 301 historical records in unified React source
        run: cd hhba-source && node --test apps/web/scripts/domestic-preview.test.mjs
      - name: Install React build dependencies
        run: npm ci --prefix hhba-source/apps/web
      - name: Build the original HHBA React UI for project subpath
        env:
          HHBA_GITHUB_PAGES: '1'
          HHBA_PAGES_BASE: '/yanmingjun.github.io/hhba-unified-preview/'
          VITE_HHBA_VERIFIED_SNAPSHOT: '1'
          VITE_HHBA_DOMESTIC_STATIC_ONLY: '1'
        run: npm run build --prefix hhba-source/apps/web
      - name: Stage public bundle without source, secrets or node_modules
        run: |
          mkdir -p hhba-unified-preview
          cp -R hhba-source/apps/web/dist/. hhba-unified-preview/
          test -f hhba-unified-preview/index.html
          node -e "let x=require('./hhba-unified-preview/data/domestic-jobs.json');if(x.total!==301)process.exit(1)"
          rm -rf hhba-source
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Install headless browser for independent UI acceptance
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-test unified HHBA market, Chinese search and job detail
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({locale:'zh-CN',viewport:{width:1360,height:900}});
            const site='https://yanm-jun.github.io/yanmingjun.github.io/hhba-unified-preview/';
            try{
              let response=await page.goto(site,{waitUntil:'domcontentloaded',timeout:60000});
              assert.equal(response.status(),200,'GitHub Pages HTTP response');
              await page.locator('.unified-job-card').first().waitFor({timeout:45000});
              assert.ok((await page.locator('.unified-job-card').count())>0,'no historical cards');
              const search=page.getByRole('textbox',{name:'自然语言搜索岗位'});
              await search.fill('小米');
              await page.locator('.unified-job-card').first().waitFor({timeout:15000});
              await page.screenshot({path:'hhba-domestic-list.png',fullPage:true});
              await page.locator('.unified-job-card a[href*="/candidate/jobs/"]').first().click();
              await page.locator('.unified-detail-card').waitFor({timeout:30000});
              assert.match(await page.locator('.unified-detail-card').innerText(),/历史收录|历史岗位|历史记录/);
              const apply=page.locator('.unified-detail-card a[href^="https://xiaomi.jobs.f.mioffice.cn/"]');
              assert.ok((await apply.count())>0,'missing official apply/source URL');
              await page.screenshot({path:'hhba-domestic-detail.png',fullPage:true});
              console.log('PASSED: Github Pages React market, Xiaomi Chinese search, real historical detail and official link');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Attach browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hhba-domestic-github-pages-browser-proof
          path: |
            hhba-domestic-list.png
            hhba-domestic-detail.png
          if-no-files-found: warn
          retention-days: 14
