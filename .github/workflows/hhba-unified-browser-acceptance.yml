name: HHBA Unified Pages Browser Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'hhba-unified-preview/**'
      - '.github/workflows/hhba-unified-browser-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify restored archival duties and requirements
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const jobs=JSON.parse(fs.readFileSync('hhba-unified-preview/data/domestic-jobs.json','utf8'));
          const summaries=JSON.parse(fs.readFileSync('hhba-unified-preview/data/domestic-jd-summaries.json','utf8'));
          if(jobs.total!==301||summaries.total!==301||summaries.jobs.length!==jobs.jobs.length)throw Error('301 source jobs missing');
          const row=summaries.jobs.find(j=>j.id==='domestic-xiaomi-7536168291875094637');
          if(!row?.responsibilities.includes('整车物流')||!row?.requirements.includes('物流'))throw Error('Logistics job duties not restored');
          console.log('HHBA_301_DOMESTIC_CONTENT_RESTORED',summaries.jobs.length);
          NODE
      - name: Install Chromium test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Public browser check of unified React detail page
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({locale:'zh-CN',viewport:{width:1280,height:900}});
              const url='https://yanm-jun.github.io/yanmingjun.github.io/hhba-unified-preview/';
              let ready=false;
              for(let n=0;n<8;n++){
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                if(response?.status()===200){ready=true;break}
                await new Promise(r=>setTimeout(r,5000));
              }
              assert.ok(ready,'Pages React preview HTTP not ready');
              await page.locator('.unified-job-card').first().waitFor({timeout:30000});
              assert.ok(await page.locator('.unified-job-card').count()>0,'No Xiaomi job cards');
              await page.screenshot({path:'hhba-domestic-jobs.png',fullPage:true});
              await page.locator('.unified-job-card h3 a').first().click();
              await page.locator('.unified-detail-card').waitFor({timeout:15000});
              await page.getByText('岗位职责（历史整理）').waitFor({timeout:15000});
              await page.getByText('任职要求（历史整理）').waitFor({timeout:15000});
              const content=await page.locator('.unified-detail-card').innerText();
              assert.ok(content.length>250,'Job details are incomplete');
              assert.ok(content.includes('不是完整官方 JD'),'Archived summary must not pretend original complete JD');
              assert.ok((await page.locator('.unified-detail-card a[href^="https://xiaomi.jobs.f.mioffice.cn/"]').count())>0,'official Xiaomi link missing');
              await page.screenshot({path:'hhba-domestic-detail.png',fullPage:true});
              console.log('PASSED: live static unified job card, source-linked duties, qualification text, and official apply link');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hhba-domestic-react-browser-proof
          path: |
            hhba-domestic-jobs.png
            hhba-domestic-detail.png
          if-no-files-found: warn
          retention-days: 7
